<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw — Trợ lý AI cá nhân</title>
  <desc id="desc">Biểu tượng tôm hùm robot màu san hô bên cạnh thương hiệu OpenClaw và khẩu hiệu EXFOLIATE! EXFOLIATE!</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f7fa"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7865"/>
      <stop offset=".55" stop-color="#ff4d45"/>
      <stop offset="1" stop-color="#e93e43"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ff7665" stop-opacity=".17"/>
      <stop offset="1" stop-color="#ff7665" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#d9dee7"/>
    </pattern>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#a52b2b" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1600" height="450" rx="18" fill="url(#background)"/>
  <rect width="1600" height="450" rx="18" fill="url(#dots)" opacity=".42"/>
  <ellipse cx="315" cy="225" rx="260" ry="220" fill="url(#halo)"/>
  <circle cx="1480" cy="65" r="155" fill="#fff1ee" opacity=".72"/>
  <path d="M0 410 C280 380 450 470 690 430 S1180 380 1600 420" fill="none" stroke="#f1e4e3" stroke-width="2"/>
  <path d="M64 68h42M85 47v42M1510 365h28M1524 351v28" stroke="#ff8b7a" stroke-width="3" stroke-linecap="round" opacity=".6"/>

  <g transform="translate(315 226)" filter="url(#softShadow)">
    <!-- antennae -->
    <path d="M-35 -103C-53 -142 -81 -154 -102 -149M35 -103C53 -142 81 -154 102 -149" fill="none" stroke="#ff6256" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-103" cy="-149" r="7" fill="#ff6256"/>
    <circle cx="103" cy="-149" r="7" fill="#ff6256"/>

    <!-- arms and claws -->
    <path d="M-77 -62C-117 -89 -154 -79 -170 -51C-184 -28 -169 -4 -146 -6L-124 -27C-117 -40 -104 -37 -96 -24Z" fill="url(#shell)"/>
    <path d="M-168 -41C-192 -38 -204 -20 -194 -2C-185 15 -163 14 -151 1L-158 -17C-170 -17 -175 -27 -168 -41Z" fill="#ff6857"/>
    <path d="M77 -62C117 -89 154 -79 170 -51C184 -28 169 -4 146 -6L124 -27C117 -40 104 -37 96 -24Z" fill="url(#shell)"/>
    <path d="M168 -41C192 -38 204 -20 194 -2C185 15 163 14 151 1L158 -17C170 -17 175 -27 168 -41Z" fill="#ff6857"/>

    <!-- legs -->
    <path d="M-63 48L-93 79L-79 88L-42 64M63 48L93 79L79 88L42 64" fill="none" stroke="#ef4748" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-38 60L-45 87L-25 91L-11 66M38 60L45 87L25 91L11 66" fill="none" stroke="#ef4748" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- shell -->
    <path d="M-91 -49C-100 -103 -63 -137 0 -139C63 -137 100 -103 91 -49L79 14C73 49 39 68 0 72C-39 68 -73 49 -79 14Z" fill="url(#shell)"/>
    <path d="M-66 -94C-47 -116 -25 -123 0 -124C25 -123 47 -116 66 -94" fill="none" stroke="#ffad93" stroke-width="7" stroke-linecap="round" opacity=".76"/>

    <!-- eyes -->
    <ellipse cx="-34" cy="-76" rx="20" ry="23" fill="#172332"/>
    <ellipse cx="34" cy="-76" rx="20" ry="23" fill="#172332"/>
    <circle cx="-34" cy="-77" r="8.5" fill="#24e0dc"/>
    <circle cx="34" cy="-77" r="8.5" fill="#24e0dc"/>
    <circle cx="-37" cy="-81" r="2.5" fill="#ffffff"/>
    <circle cx="31" cy="-81" r="2.5" fill="#ffffff"/>

    <!-- lower body and feet -->
    <path d="M-57 23C-42 42 -22 49 0 51C22 49 42 42 57 23L48 55C34 70 17 76 0 77C-17 76 -34 70 -48 55Z" fill="#f84c49"/>
    <path d="M-36 80V100Q-36 106 -30 106H-15Q-9 106 -9 100V83M9 83V100Q9 106 15 106H30Q36 106 36 100V80" fill="#ef4748"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="600" y="224" font-size="108" font-weight="800" letter-spacing="-4.5" fill="#111318">Open<tspan fill="#ff5149">Claw</tspan></text>
    <text x="610" y="289" font-size="28" font-weight="700" letter-spacing="5.6" fill="#ff5149">EXFOLIATE! EXFOLIATE!</text>
    <text x="612" y="337" font-size="25" font-weight="500" fill="#686d77">Your personal AI assistant, running on your own devices.</text>
    <path d="M612 369H970" stroke="#f4c7c1" stroke-width="3" stroke-linecap="round"/>
    <circle cx="988" cy="369" r="4" fill="#ff5149"/>
  </g>
</svg>
